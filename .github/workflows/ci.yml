name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/repository-standards]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-python311:
    name: Windows Python 3.11
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Prepare fresh outputs
        run: New-Item -ItemType Directory -Path outputs -ErrorAction Stop | Out-Null

      - name: Run test suite
        run: python -X utf8 -m pytest tests -q --basetemp=outputs/ci_pytest --junitxml=outputs/ci_pytest.xml

      - name: Require tests to run without skips
        run: |
          [xml]$report = Get-Content -LiteralPath 'outputs/ci_pytest.xml' -Raw
          $suites = @($report.testsuites.testsuite)
          $tests = ($suites | ForEach-Object { [int]$_.tests } | Measure-Object -Sum).Sum
          $skipped = ($suites | ForEach-Object { [int]$_.skipped } | Measure-Object -Sum).Sum
          if ($tests -lt 1 -or $skipped -ne 0) {
            throw "Expected executed Windows tests without skips; tests=$tests, skipped=$skipped"
          }

      - name: Run synthetic handoff workflow
        run: python -X utf8 scripts/team3_run.py synthetic --out outputs/ci_synthetic

      - name: Verify synthetic workflow receipt
        run: |
          $receipt = Get-Content -LiteralPath 'outputs/ci_synthetic/workflow.json' -Raw | ConvertFrom-Json
          if ($receipt.status -ne 'PASS' -or $receipt.exit_code -ne 0) {
            throw 'Synthetic workflow did not pass'
          }
          if ($receipt.protected_unchanged -ne $true -or $receipt.run_source_unchanged -ne $true) {
            throw 'Synthetic inputs or checked results were changed'
          }
