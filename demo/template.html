<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自主观测 · 调度实验回放</title>
<style>
:root{color-scheme:dark;--bg:#0b111b;--panel:#121c2b;--line:#29384b;--text:#edf3fb;--muted:#98a9bf;--teal:#5ed8c2;--orange:#ffb66b;--red:#ff777b;--blue:#7daeff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1500px;margin:auto;padding:34px 42px 26px}.eyebrow{letter-spacing:3px;font-size:12px;color:var(--teal);font-weight:700}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}h1{font-size:30px;font-weight:650;letter-spacing:1px;line-height:1.35;margin:10px 0}p{margin:5px 0;color:var(--muted)}.badge{border:1px solid #30534c;background:#16342f;color:var(--teal);padding:7px 12px;border-radius:6px;white-space:nowrap}.badge.bad{border-color:#6b3940;background:#3c2028;color:var(--red)}.controls{display:flex;flex-wrap:wrap;align-items:end;gap:18px;margin:28px 0 20px;padding:18px 20px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px}select,button{font:inherit;color:var(--text);background:#182539;border:1px solid #34465e;border-radius:6px;padding:9px 13px;cursor:pointer}select{min-width:130px}button:hover,select:hover{border-color:var(--teal)}button[aria-pressed=true]{color:#0d211d;background:var(--teal);border-color:var(--teal);font-weight:700}button:disabled{cursor:default;opacity:.45}.spacer{flex:1}.segmented{display:flex;gap:6px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card{background:var(--panel);padding:18px 20px;border:1px solid var(--line);border-radius:9px}.card .label{color:var(--muted);font-size:12px}.value{font-size:31px;line-height:1.4;font-weight:650;font-variant-numeric:tabular-nums}.sub{color:var(--muted);font-size:12px}.chart-panel{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:21px 22px 15px}.chart-top{display:flex;align-items:center;justify-content:space-between;gap:15px}.chart-top h2{font-size:17px;margin:0}.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:14px 0}.dot{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px}.scroll{overflow-x:auto}svg{width:100%;height:280px;display:block;min-width:720px}.legend-note{font-size:12px;color:var(--muted)}.bottom{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:16px}.detail,.audit{border:1px solid var(--line);border-radius:9px;padding:17px 20px;background:var(--panel);min-height:160px}h3{font-size:14px;margin:0 0 9px}.impact-grid{display:flex;gap:24px;flex-wrap:wrap}.impact-grid b{display:block;font-size:24px}.impact-grid span{color:var(--muted);font-size:12px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-variant-numeric:tabular-nums}.detail-grid span{color:var(--muted)}.fineprint{font-size:11px;color:#8799b0;margin-top:15px;overflow-wrap:anywhere}.alert{border:1px solid #81424a;background:#3a1d28;color:#ffbcc0;border-radius:9px;padding:15px;margin:20px 0}.hidden{display:none!important}.task{cursor:pointer;outline:none}.task:hover,.task:focus{stroke:white!important;stroke-width:2.5!important}.audit strong{color:var(--teal)}.run{font-size:11px;color:var(--muted);text-align:right;max-width:300px}.pill{color:var(--orange)}@media(max-width:800px){main{padding:20px 16px}.top{display:block}.run{text-align:left}.cards{grid-template-columns:1fr 1fr}.bottom{grid-template-columns:1fr}h1{font-size:25px}.controls{gap:10px}.chart-top{flex-wrap:wrap}}
</style></head><body><main>
<div class="top"><div><div class="eyebrow">AUTONOMOUS OBSERVATION / EXPERIMENT REPLAY</div><h1>从初始计划，到故障后的下一步</h1><p id="subtitle">冻结样本 · 两种调度方法 · 可追溯的实验回放</p></div><div><div id="status" class="badge">等待证据</div><div id="run" class="run"></div></div></div>
<div id="errors" class="alert hidden" role="alert"></div>
<section id="app">
<div class="controls"><label>实验场景<select id="scenario"><option value="early">E3 · 原始早期故障</option><option value="late">E4 · 较晚故障（seed42）</option></select></label><label>冻结样本<select id="seed"><option>42</option><option>17</option><option>23</option></select></label><label>调度方法<select id="method"><option value="baseline">基线 · 时间贪心</option><option value="improved">改进 · 优先级 / 稀缺性</option></select></label><div class="spacer"></div><div class="segmented" aria-label="回放视图"><button data-view="0" aria-pressed="true">① 初始计划</button><button data-view="1" aria-pressed="false">② 故障影响</button><button data-view="2" aria-pressed="false">③ 重规划结果</button></div></div>
<div class="cards"><div class="card"><div id="score-label" class="label">计划任务分</div><div id="score" class="value">—</div><div id="gain" class="sub"></div></div><div class="card"><div class="label">不同目标覆盖</div><div id="coverage" class="value">—</div><div id="executable" class="sub"></div></div><div class="card"><div class="label">独立约束违例</div><div id="violations" class="value">—</div><div id="scope" class="sub"></div></div><div class="card"><div class="label">本轮实际求解耗时</div><div id="timing" class="value">—</div><div id="timing-note" class="sub"></div></div></div>
<div class="chart-panel"><div class="chart-top"><div><h2 id="chart-title">初始计划 · 24 小时全貌</h2><p id="event-note" class="legend-note"></p></div><div class="segmented"><button id="zoom" aria-pressed="false">查看故障附近</button><button id="step">下一步 →</button><button id="play" aria-pressed="false">播放回放</button></div></div><div id="legend" class="legend"></div><div class="scroll"><svg id="timeline" viewBox="0 0 1280 280" role="img" aria-label="UTC站点任务时间线"></svg></div><p id="view-note" class="legend-note"></p></div>
<div class="bottom"><div class="detail"><h3>任务详情 <span class="sub">悬停、点击或键盘聚焦时间条</span></h3><div id="task-detail" class="detail-grid"><span>选择任意任务，查看其来源与状态。</span></div></div><div class="audit"><h3>该方法实际受到的故障影响</h3><div id="impact" class="impact-grid"></div><p id="changes" class="sub"></p><p id="audit-note" class="sub"></p></div></div>
</section><footer class="fineprint"><p id="disclaimer"></p><p id="provenance"></p></footer>
</main><script id="demo-data" type="application/json">__DEMO_PAYLOAD__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('demo-data').textContent),$=id=>document.getElementById(id);
const colors={initial_plan:'#7daeff',completed:'#5ed8c2',locked:'#c7a2ff',interrupted:'#ffb66b',new_success:'#73b6ff',affected_future:'#ff777b',future_original:'#586b85'};
const labels={initial_plan:'初始安排（预计）',completed:'已完成',locked:'健康站锁定',interrupted:'中断 · 零分',new_success:'新安排（预计）',affected_future:'故障影响的原未来安排',future_original:'原未来安排 · 未执行'};
let view=0,zoom=false,timer=null;
const fmt=s=>new Date(Date.parse(current().start_utc)+s*1000).toISOString().slice(11,19)+' UTC';
function current(){return data.cases.find(c=>c.scenario===$('scenario').value&&c.seed===Number($('seed').value))}
function svg(tag,attrs={},text){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n}
function stop(){if(timer)clearInterval(timer);timer=null;$('play').textContent='播放回放';$('play').setAttribute('aria-pressed','false')}
function detail(r,status){const box=$('task-detail');box.replaceChildren();const values=[['目标',r.satnum],['优先级',{high:'高',medium:'中',low:'低'}[r.priority]],['站点',r.station_id],['状态',labels[status]],['UTC 开始',r.start_utc],['UTC 结束',r.end_utc],['时长',r.duration_s+' 秒'],['任务分',status==='interrupted'?'0（不计成功）':r.score+'（'+(status==='completed'?'已完成':'计划值')+'）']];for(const[k,v]of values){const n=document.createElement('div'),a=document.createElement('span');a.textContent=k+'：';n.append(a,document.createTextNode(String(v)));box.append(n)}}
function draw(c,m){const plot=$('timeline');plot.replaceChildren();const event=c.event;let lo=0,hi=c.horizon_seconds;if(zoom){lo=Math.max(0,event.start_s-600);hi=Math.min(c.horizon_seconds,event.start_s+900)}const x=s=>100+(s-lo)/(hi-lo)*1140;const stations=[...c.station_ids].sort((a,b)=>a-b);if(!stations.length){plot.append(svg('text',{x:120,y:130,fill:'#98a9bf'},'暂无任务；空计划不代表成功观测。'));return}const y=s=>57+stations.indexOf(s)*64;const ticks=zoom?5:8;for(let i=0;i<=ticks;i++){const s=lo+(hi-lo)*i/ticks;plot.append(svg('line',{x1:x(s),y1:32,x2:x(s),y2:235,stroke:'#26364b'}));plot.append(svg('text',{x:x(s),y:264,fill:'#98a9bf','font-size':11,'text-anchor':'middle'},fmt(s).slice(0,8)))}for(const sid of stations){plot.append(svg('rect',{x:100,y:y(sid),width:1140,height:38,fill:'#182539',rx:4}));plot.append(svg('text',{x:10,y:y(sid)+24,fill:'#dce8f8','font-size':14},'站点 '+sid))}const fa=Math.max(lo,event.start_s),fb=Math.min(hi,event.end_s);if(fb>fa&&stations.includes(event.station_id)){plot.append(svg('rect',{x:x(fa),y:y(event.station_id)-5,width:x(fb)-x(fa),height:48,fill:'#ff777b','fill-opacity':.15,stroke:'#ff777b','stroke-dasharray':'5 4'}))}if(event.start_s>=lo&&event.start_s<=hi){plot.append(svg('line',{x1:x(event.start_s),y1:25,x2:x(event.start_s),y2:240,stroke:'#ffb66b','stroke-width':1.5,'stroke-dasharray':'4 4'}));plot.append(svg('text',{x:Math.min(1120,x(event.start_s)+5),y:20,fill:'#ffb66b','font-size':11},'故障 '+fmt(event.start_s)))}let rows=[];if(view===0)rows=m.initial.map(r=>[r,'initial_plan']);else if(view===2)rows=[...m.replanned.map(r=>[r,r.status]),...m.history.interrupted.map(r=>[r,'interrupted'])];else{const groups=m.impact.task_ids;rows=m.initial.map(r=>{if(groups.completed.includes(r.task_id))return[r,'completed'];if(groups.locked.includes(r.task_id))return[r,'locked'];if(groups.interrupted.includes(r.task_id))return[m.history.interrupted.find(f=>f.task_id===r.task_id),'interrupted'];return[r,groups.affected_future.includes(r.task_id)?'affected_future':'future_original']})}for(const[r,state]of rows){if(r.end_s<=lo||r.start_s>=hi)continue;const rect=svg('rect',{x:x(Math.max(lo,r.start_s)),y:y(r.station_id)+5,width:Math.max(.8,x(Math.min(hi,r.end_s))-x(Math.max(lo,r.start_s))),height:28,rx:3,fill:colors[state],opacity:state==='future_original'?.5:1,stroke:state==='affected_future'?colors[state]:'none','stroke-dasharray':state==='affected_future'?'3 2':'none',tabindex:0,class:'task','data-target':r.satnum,'data-state':state,'aria-label':`目标 ${r.satnum} ${labels[state]} ${r.start_utc}`});rect.append(svg('title',{},`目标 ${r.satnum} · ${labels[state]}\n${r.start_utc} — ${r.end_utc}\n${r.duration_s}s · ${r.score} 分`));for(const evt of ['mouseenter','click','focus'])rect.addEventListener(evt,()=>detail(r,state));plot.append(rect);if(state==='interrupted'&&view===1&&r.planned_end_s>event.start_s){const end=Math.min(hi,r.planned_end_s);if(end>Math.max(lo,event.start_s))plot.append(svg('rect',{x:x(Math.max(lo,event.start_s)),y:y(r.station_id)+5,width:x(end)-x(Math.max(lo,event.start_s)),height:28,fill:'none',stroke:colors.interrupted,'stroke-dasharray':'4 3'}))}}}
function render(){const c=current();if(!c){$('app').classList.add('hidden');$('errors').classList.remove('hidden');$('errors').textContent='BLOCKED：所选场景缺少可验证结果。';return}const m=c.methods[$('method').value],metric=view===2?m.replanned_metrics:m.initial_metrics;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.view)===view)));$('status').textContent='独立校验 '+c.status;$('run').textContent=c.run_id+' · '+data.generated_at.slice(0,10);$('score-label').textContent=view===1?'原初始计划任务分（并非已执行）':view===2?'重规划计划任务分':'初始计划任务分';$('score').textContent=metric.task_score.toFixed(1);const baseline=c.methods.baseline,base=view===2?baseline.replanned_metrics:baseline.initial_metrics;$('gain').textContent='相对同场景基线 '+((metric.points_int-base.points_int)/5).toFixed(1)+' 分 · 初始候选上界 '+c.candidate_upper_bound.task_score.toFixed(1);$('coverage').textContent=metric.coverage+' / '+metric.coverage_all.denominator;$('executable').textContent='全部 '+(100*metric.coverage_all.rate).toFixed(1)+'% · 可执行 '+metric.coverage+'/'+metric.coverage_executable.denominator+'（'+(100*metric.coverage_executable.rate).toFixed(1)+'%）';$('violations').textContent=metric.violation_count;$('scope').textContent=c.scope==='raw_TLE_per_second'?'真实 TLE · 两端及逐整数秒检查':'仅供应窗口内调度约束';$('timing').textContent=((view===2?m.replanned_seconds:m.initial_seconds)*1000).toFixed(2)+' ms';$('timing-note').textContent='预计算实测 · '+(view===2?'重规划':'初始排程')+'（含回退成本）';$('chart-title').textContent=['初始计划','故障影响 · 原计划快照','重规划结果'][view]+' · '+(zoom?'故障附近细节':c.horizon_seconds/3600+' 小时全貌');$('event-note').textContent=`站点 ${c.event.station_id} 不可用：${fmt(c.event.start_s)} — ${fmt(c.event.end_s)}；横轴 UTC`;$('zoom').textContent=zoom?'返回完整 '+c.horizon_seconds/3600+' 小时':'查看故障附近';$('zoom').setAttribute('aria-pressed',String(zoom));$('view-note').textContent=['初始计划是计划值。短任务在全日视图中较细，可切换故障附近查看。','故障后的原未来安排尚未执行；虚线为失效/中断尾段，不计作新的成功。','已完成与健康站执行中任务保留；新增为计划安排，中断片段计零分。'][view];const states=view===0?['initial_plan']:view===1?['completed','locked','interrupted','affected_future','future_original']:['completed','locked','interrupted','new_success'];$('legend').replaceChildren();for(const s of states){const el=document.createElement('span'),dot=document.createElement('i');dot.className='dot';dot.style.background=colors[s];el.append(dot,document.createTextNode(labels[s]));$('legend').append(el)}$('impact').replaceChildren();for(const[k,label]of [['completed','已完成'],['locked','健康站锁定'],['interrupted','故障站中断'],['affected_future','受影响未来']]){const el=document.createElement('div'),b=document.createElement('b'),s=document.createElement('span');b.textContent=m.impact.counts[k];s.textContent=label;el.append(b,s);$('impact').append(el)}$('changes').textContent='净调整目标 '+m.changes.net_adjusted_target_count+'：新增 '+m.changes.counts.added+' / 删除 '+m.changes.counts.deleted+' / 移动或改时长 '+m.changes.counts.moved_or_duration_changed+' / 保留 '+m.changes.counts.retained;$('audit-note').textContent='完成、锁定及中断历史按冻结初始计划独立核对；源计划的影响列表未套用于其他方法。';$('provenance').textContent='数据版本：'+c.data_version+' · 运行：'+c.run_id+' · 窗口：'+(c.cache.mode==='sealed_source_reuse'?'封存结果复用（非冷启动）':c.cache.mode==='provided_windows_no_propagation'?'供应窗口（无轨道传播）':c.cache.hit?'缓存命中（非冷启动）':'冷启动计算');$('task-detail').replaceChildren(document.createTextNode('选择任意任务，查看其来源与状态。'));draw(c,m);window.demoState={seed:c.seed,scenario:c.scenario,method:$('method').value,view,zoom,score:metric.task_score,coverage:metric.coverage,violations:metric.violation_count}}
$('disclaimer').textContent=data.disclaimer;
$('subtitle').textContent=(data.synthetic?'合成契约示例 · 非真实观测':'真实几何实验 · '+new Set(data.cases.map(c=>c.seed)).size+' 个冻结样本')+' · 两种调度方法';
for(const option of $('scenario').options)option.disabled=!data.cases.some(c=>c.scenario===option.value);
for(const option of $('seed').options)option.disabled=!data.cases.some(c=>c.scenario==='early'&&c.seed===Number(option.value));
if(data.status!=='PASS'||!data.cases.length){$('errors').classList.remove('hidden');$('errors').textContent=data.status+'：'+data.issues.map(i=>i.reason).join('；');$('status').textContent='证据 '+data.status;$('status').classList.add('bad');$('app').classList.add('hidden')}else{for(const id of ['scenario','seed','method'])$(id).addEventListener('change',()=>{stop();if($('scenario').value==='late')$('seed').value='42';$('seed').disabled=$('scenario').value==='late';render()});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{stop();view=Number(b.dataset.view);render()}));$('step').addEventListener('click',()=>{stop();view=(view+1)%3;render()});$('zoom').addEventListener('click',()=>{zoom=!zoom;render()});$('play').addEventListener('click',()=>{if(timer)stop();else{timer=setInterval(()=>{view=(view+1)%3;render()},1800);$('play').textContent='暂停回放';$('play').setAttribute('aria-pressed','true')}});render()}
</script></body></html>
